[package]
name = "amlgraphx-native"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"

[lib]
name = "_core"
crate-type = ["cdylib"]
path = "lib.rs"

[dependencies]
numpy = "0.24"
ordered-float = "5.0"
pyo3 = { version = "0.24", features = ["extension-module"] }
rayon = "1.10"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
