[project]
name = "amlgraphx"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "pigu163" }
]
requires-python = ">=3.12"
dependencies = [
    "catboost>=1.2.10",
    "huggingface-hub>=1.28.0",
    "lightgbm>=4.7.0",
    "mlflow>=3.15.2",
    "numpy>=2.5.2",
    "polars>=1.43.2",
    "pyarrow>=25.0.1",
    "pydantic>=2.13.4",
    "scikit-learn>=1.9.0",
    "shap>=0.52.0",
    "tensorboard>=2.21.0",
    "torch>=2.13.0",
    "torch-geometric>=2.8.0.post1",
    "torch-spatiotemporal>=0.9.5",
    "torchmetrics>=1.9.0",
    "xgboost>=3.4.1",
]

[build-system]
requires = ["maturin>=1.14,<2.0"]
build-backend = "maturin"

[tool.maturin]
bindings = "pyo3"
module-name = "amlgraphx._native._core"
python-source = "src"
manifest-path = "rust/Cargo.toml"

[dependency-groups]
dev = [
    "maturin>=1.14.1",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "ruff>=0.16.4",
    "snapml>=1.17.2",
]
docs = [
    "furo>=2025.12.19",
    "myst-nb>=1.4.0",
    "myst-parser>=5.1.0",
    "sphinx>=9.1.0",
    "sphinx-autobuild>=2025.8.25",
    "sphinx-autodoc-typehints>=3.13.4",
    "sphinx-copybutton>=0.5.2",
    "sphinx-design>=0.7.0",
]

[[tool.uv.index]]
name = "pytorch-cu132"
url = "https://download.pytorch.org/whl/cu132"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu132" }
